<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar Engine — Stima Fotovoltaico</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f9fa;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #fff;
        border-bottom: 1px solid #e9ecef;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .logo {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #f59e0b, #f97316);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      header h1 {
        font-size: 16px;
        font-weight: 600;
        color: #111;
      }

      header span {
        font-size: 12px;
        color: #6b7280;
        margin-left: 4px;
        font-weight: 400;
      }

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .bubble-wrap {
        display: flex;
        flex-direction: column;
        max-width: 80%;
      }

      .bubble-wrap.user { align-self: flex-end; align-items: flex-end; }
      .bubble-wrap.assistant { align-self: flex-start; align-items: flex-start; }

      .bubble {
        padding: 12px 16px;
        border-radius: 18px;
        line-height: 1.5;
        font-size: 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble-wrap.user .bubble {
        background: #f97316;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .bubble-wrap.assistant .bubble {
        background: #fff;
        color: #111;
        border: 1px solid #e9ecef;
        border-bottom-left-radius: 4px;
      }

      .typing {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 14px 16px;
        background: #fff;
        border: 1px solid #e9ecef;
        border-radius: 18px;
        border-bottom-left-radius: 4px;
        width: fit-content;
      }

      .typing span {
        width: 7px;
        height: 7px;
        background: #9ca3af;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 20px 12px;
      }

      .suggestion {
        background: #fff;
        border: 1px solid #e9ecef;
        border-radius: 20px;
        padding: 8px 14px;
        font-size: 13px;
        color: #374151;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        white-space: nowrap;
      }

      .suggestion:hover {
        border-color: #f97316;
        color: #f97316;
        background: #fff7ed;
      }

      footer {
        background: #fff;
        border-top: 1px solid #e9ecef;
        padding: 12px 16px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-shrink: 0;
      }

      #input {
        flex: 1;
        border: 1px solid #e9ecef;
        border-radius: 22px;
        padding: 10px 16px;
        font-size: 15px;
        font-family: inherit;
        resize: none;
        outline: none;
        max-height: 120px;
        line-height: 1.5;
        transition: border-color 0.15s;
      }

      #input:focus { border-color: #f97316; }

      #send {
        width: 42px;
        height: 42px;
        background: #f97316;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.15s, transform 0.1s;
      }

      #send:hover { background: #ea6c0a; }
      #send:active { transform: scale(0.93); }
      #send:disabled { background: #d1d5db; cursor: not-allowed; }

      #send svg { width: 18px; height: 18px; fill: #fff; }

      .powered {
        text-align: center;
        font-size: 11px;
        color: #9ca3af;
        padding: 6px 0 2px;
        flex-shrink: 0;
      }

      .powered a { color: #9ca3af; text-decoration: none; }
      .powered a:hover { color: #6b7280; }

      @media (max-width: 600px) {
        .bubble-wrap { max-width: 92%; }
        #chat { padding: 14px; }
        .suggestions { padding: 0 14px 10px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">☀️</div>
      <h1>Solar Engine <span>— Stima fotovoltaico gratuita</span></h1>
    </header>

    <div id="chat">
      <div class="bubble-wrap assistant">
        <div class="bubble">Ciao! Sono l'assistente di Solar Engine. 👋

Dimmi il tuo indirizzo e il consumo elettrico annuo (lo trovi sulla bolletta come "consumo annuo kWh") e calcolo subito quanto puoi risparmiare con il fotovoltaico.</div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion" onclick="useSuggestion(this)">Ho una casa a Milano, consumo 3.500 kWh annui</button>
      <button class="suggestion" onclick="useSuggestion(this)">Via Roma 1, Bari — 5.000 kWh l'anno</button>
      <button class="suggestion" onclick="useSuggestion(this)">Napoli, tetto Est-Ovest, 4.200 kWh</button>
    </div>

    <footer>
      <textarea id="input" rows="1" placeholder="Scrivi il tuo indirizzo e consumo…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send" onclick="sendMessage()" title="Invia">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </footer>

    <p class="powered">Powered by <a href="https://api.marcorinaldo.it" target="_blank">Solar Engine</a> · Dati PVGIS-EU</p>

    <script>
      const API = "https://api.marcorinaldo.it/v1/chat";
      let history = [];
      let isLoading = false;

      function autoResize(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      }

      function handleKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function useSuggestion(btn) {
        document.getElementById("suggestions").style.display = "none";
        document.getElementById("input").value = btn.textContent;
        sendMessage();
      }

      function appendBubble(role, text) {
        const chat = document.getElementById("chat");
        const wrap = document.createElement("div");
        wrap.className = `bubble-wrap ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrap.appendChild(bubble);
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
      }

      function showTyping() {
        const chat = document.getElementById("chat");
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap assistant";
        wrap.id = "typing-indicator";
        wrap.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
        chat.appendChild(wrap);
        chat.scrollTop = chat.scrollHeight;
      }

      function hideTyping() {
        document.getElementById("typing-indicator")?.remove();
      }

      async function sendMessage() {
        if (isLoading) return;
        const input = document.getElementById("input");
        const message = input.value.trim();
        if (!message) return;

        document.getElementById("suggestions").style.display = "none";
        input.value = "";
        input.style.height = "auto";
        appendBubble("user", message);

        isLoading = true;
        document.getElementById("send").disabled = true;
        showTyping();

        try {
          const res = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, history }),
          });

          hideTyping();

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            appendBubble("assistant", err.error ?? "Errore di rete. Riprova tra qualche secondo.");
            return;
          }

          const data = await res.json();
          history = data.history;
          appendBubble("assistant", data.reply);
        } catch {
          hideTyping();
          appendBubble("assistant", "Connessione non riuscita. Controlla la tua rete e riprova.");
        } finally {
          isLoading = false;
          document.getElementById("send").disabled = false;
          document.getElementById("input").focus();
        }
      }
    </script>
  </body>
</html>
